# link scritto da ~/.local/bin/theme: lo sfondo del tema (cerchi chiaro/scuro) o il colore pieno (nero)
$wallpaper_path= ~/.local/state/theme/wallpaper

# monitor vuoto: tutti i monitor (in dock G9 e Xiaomi hanno un DP-x diverso dal fisso)
wallpaper {
    monitor =
    path = $wallpaper_path
    fit_mode = cover
}

# # enable splash text rendering over the wallpaper
splash = false
ipc = on   # theme cambia lo sfondo con hyprctl hyprpaper
