# Agent Deck Configuration
# All options: https://github.com/asheshgoplani/agent-deck/blob/main/skills/agent-deck/references/config-reference.md

default_tool = "claude"
theme = "dark"

[claude]
  command = "claude-personal"
  config_dir = "~/.claude-profiles/personal"
  dangerous_mode = true

  [groups.Apricity]
    default_path = "~/work/projects/apricity"
  [groups.inbox]
    create = true
    default_path = "~/inbox/claude"

[global_search]
  enabled = true
  tier = "auto"
  recent_days = 90

[logs]
  max_size_mb = 10
  max_lines = 10000

[conductor]
  heartbeat_interval = 15
  # Niente regole "ask" nei settings dei conductor: decide il loro permission mode (popup di conferma su session stop/start).
  permission_ask = false

# Bridge Telegram ↔ regia (servizio agent-deck-conductor-bridge, hosts/desktop/user-services.nix in ~/.nixos).
# Bot e utente dal file ~/.config/agent-deck/telegram.env (vault: agent-deck-telegram.env).
[conductor.telegram]
  token = "$TELEGRAM_BOT_TOKEN"
  user_id = "$TELEGRAM_USER_ID"

[tmux]
  inject_status_line = false

