# Agent Deck Configuration
# All options: https://github.com/asheshgoplani/agent-deck/blob/main/skills/agent-deck/references/config-reference.md

default_tool = "claude"
theme = "dark"

[claude]
  command = "claude-personal"
  config_dir = "~/.claude-profiles/personal"
  dangerous_mode = true

  [groups.Apricity]
    default_path = "~/work/projects/apricity"
  [groups.inbox]
    create = true
    default_path = "~/inbox/claude"

[global_search]
  enabled = true
  tier = "auto"
  recent_days = 90

[logs]
  max_size_mb = 10
  max_lines = 10000

[conductor]
  heartbeat_interval = 30
  # Niente regole "ask" nei settings dei conductor: decide il loro permission mode (popup di conferma su session stop/start).
  permission_ask = false

# Bridge Telegram ↔ regia (servizio agent-deck-conductor-bridge, hosts/desktop/user-services.nix in ~/.nixos).
# Bot e utente dal file ~/.config/agent-deck/telegram.env (vault: agent-deck-telegram.env).
[conductor.telegram]
  token = "$TELEGRAM_BOT_TOKEN"
  user_id = "$TELEGRAM_USER_ID"

[tmux]
  inject_status_line = false


# Trascrizione dei vocali Telegram (bridge dei conductor): Whisper in llama-swap sulla 3090
[transcription]
url = "http://192.168.1.220:8080/v1/audio/transcriptions"
key_file = "/run/user/1000/secrets/llama-swap-key"
language = "it"

[voice]
# local = whisper-voce + kokoro on llama-swap; "openai" = fallback (Realtime)
backend = "local"

# Rete di sicurezza (Stefano 11/11/2026: il limite vero è sulle build pesanti, non sulle sessioni).
[group_defaults]
  max_concurrent = 8
