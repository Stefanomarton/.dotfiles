# Agent Deck Configuration
# All options: https://github.com/asheshgoplani/agent-deck/blob/main/skills/agent-deck/references/config-reference.md

default_tool = "claude"
theme = "dark"

[claude]
  config_dir = "~/.claude-profiles/personal"
  command = "claude-personal" # via cpm: arrivano le variabili di secrets.toml
  dangerous_mode = true

[global_search]
  enabled = true
  tier = "auto"
  recent_days = 90

[logs]
  max_size_mb = 10
  max_lines = 10000


[groups."inbox"]
  create = true
  default_path = "~/inbox/claude"

[groups."Apricity"]
  default_path = "~/work/projects/apricity"

[tmux]
  # The web UI and the TUI already show title, group and status: no tmux bar.
  inject_status_line = false

