# Agent Deck Configuration
# All options: https://github.com/asheshgoplani/agent-deck/blob/main/skills/agent-deck/references/config-reference.md

default_tool = "claude"
theme = "light"

[claude]
  command = "claude-personal"
  config_dir = "~/.claude-profiles/personal"
  dangerous_mode = true

  [groups.Apricity]
    default_path = "~/work/projects/apricity"
  [groups.inbox]
    create = true
    default_path = "~/inbox/claude"

[global_search]
  enabled = true
  tier = "auto"
  recent_days = 90

[logs]
  max_size_mb = 10
  max_lines = 10000

[conductor]
  heartbeat_interval = 15

[tmux]
  inject_status_line = false

