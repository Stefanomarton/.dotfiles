[pyprland]
plugins = ["scratchpads"]
hyprland_version = "0.56.0"
# yazi per workspace: le voci le genera hypr/scripts/yazi-workspace.sh
include = ["~/.config/pypr/yazi-workspaces"]

[scratchpads.yazi]
animation = ""
command = "kitty --class kitty-yazi yazi"
class = "kitty-yazi"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 10%"
size = "50% 80%"
match_by = "class"

[scratchpads.term]
animation = ""
command = "kitty --class kitty-term"
class = "kitty-term"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 5%"
size = "50% 55%"

[scratchpads.editor]
animation = ""
command = "emacs --name editor"
class = "editor"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 10%"
size = "50% 80%"

[scratchpads.qalc]
animation = ""
command = "kitty --class kitty-qalc qalc"
class = "kitty-qalc"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 70%"
size = "50% 25%"

[scratchpads.ebuku]
animation = ""
command = """kitty --class emacs-ebuku --hold emacsclient -t --eval '(ebuku)'"""
class = "emacs-ebuku"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 25%"
size = "50% 50%"

# Claude in home, senza permessi: Super+Shift+C mostra/nasconde; Super+Alt+C detta senza mostrarlo (hypr/scripts/dettatura-claude.sh, via socket @kitty-claude)
[scratchpads.claude]
animation = ""
command = "kitty --class kitty-claude -o allow_remote_control=socket-only --listen-on unix:@kitty-claude --directory ~ claude --model sonnet --dangerously-skip-permissions"
class = "kitty-claude"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 5%"
size = "50% 60%"
